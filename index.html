{{define "layout"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{if .Title}}{{.Title}} | {{end}}WingNews</title>
    <link rel="icon" type="image/png" href="/public/WingmanBlue.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link href="/output.css" rel="stylesheet" />
    <script src="https://unpkg.com/htmx.org@2.0.7" defer></script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div class="min-h-screen">
      <header class="border-b border-border bg-card">
        <div class="mx-auto flex w-full max-w-4xl items-center gap-3 px-4 py-3">
          <a href="/" class="mr-1 flex shrink-0 items-center gap-2">
            <img src="/public/WingmanBlue.png" alt="WingNews logo" class="h-5 w-5 rounded-sm object-contain" />
            <span class="text-sm font-bold tracking-tight">WingNews</span>
          </a>

          <nav aria-label="Story categories" class="flex min-w-0 items-center overflow-x-auto">
            <a class="whitespace-nowrap text-xs {{if eq .Active "top"}}font-bold text-primary{{else}}text-muted-foreground transition-colors hover:text-foreground{{end}}" href="/">top</a>
            <span class="mx-1 select-none text-xs text-muted-foreground/30">|</span>
            <a class="whitespace-nowrap text-xs {{if eq .Active "new"}}font-bold text-primary{{else}}text-muted-foreground transition-colors hover:text-foreground{{end}}" href="/new">new</a>
            <span class="mx-1 select-none text-xs text-muted-foreground/30">|</span>
            <a class="whitespace-nowrap text-xs {{if eq .Active "best"}}font-bold text-primary{{else}}text-muted-foreground transition-colors hover:text-foreground{{end}}" href="/best">best</a>
            <span class="mx-1 select-none text-xs text-muted-foreground/30">|</span>
            <a class="whitespace-nowrap text-xs {{if eq .Active "ask"}}font-bold text-primary{{else}}text-muted-foreground transition-colors hover:text-foreground{{end}}" href="/ask">ask</a>
            <span class="mx-1 select-none text-xs text-muted-foreground/30">|</span>
            <a class="whitespace-nowrap text-xs {{if eq .Active "show"}}font-bold text-primary{{else}}text-muted-foreground transition-colors hover:text-foreground{{end}}" href="/show">show</a>
            <span class="mx-1 select-none text-xs text-muted-foreground/30">|</span>
            <a class="whitespace-nowrap text-xs {{if eq .Active "jobs"}}font-bold text-primary{{else}}text-muted-foreground transition-colors hover:text-foreground{{end}}" href="/jobs">jobs</a>
          </nav>
        </div>
      </header>

      <main id="content" class="mx-auto w-full max-w-4xl px-4 py-4">{{.Content}}</main>

      <footer class="border-t border-border py-4">
        <div class="mx-auto w-full max-w-4xl px-4 text-xs text-muted-foreground/50">
          powered by
          <a href="https://github.com/HackerNews/API" class="text-muted-foreground/70 hover:text-primary">hn/api</a>
          //
          <a href="https://news.ycombinator.com" class="text-muted-foreground/70 hover:text-primary">news.ycombinator.com</a>
        </div>
      </footer>
    </div>
  </body>
</html>
{{end}}
